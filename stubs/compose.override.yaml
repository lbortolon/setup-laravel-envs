# Unito in automatico da Docker Compose a compose.yaml: aggancia il progetto
# a nginx-proxy. I valori arrivano da .env, ":?" blocca se mancano.
services:
    laravel.test:
        # !override sostituisce la lista di Sail, che pubblicherebbe la porta 80
        ports: !override
            - '${VITE_PORT:?}:${VITE_PORT:?}'
        environment:
            VIRTUAL_HOST: '${VIRTUAL_HOST:?}'
            VIRTUAL_PORT: 80
        networks:
            - proxy
networks:
    proxy:
        external: true
